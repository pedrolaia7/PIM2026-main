<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Checkout | TicketFut</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h2>RESUMO & <span>PAGAMENTO</span></h2>
        <div style="background: rgba(255,255,255,0.02); padding: 15px; border-radius: 6px; border-left: 4px solid var(--main-color); margin: 20px 0;">
            <p id="resumo-jogo" style="font-weight: 900;"></p>
            <p id="info-desconto" style="font-size: 12px; color: #00ff62; margin-top: 5px;"></p>
            <p id="resumo-valor" style="color: var(--main-color); font-size: 24px; font-weight: 900; margin-top: 10px;"></p>
        </div>
        <div class="pay-methods">
            <div class="method-btn active" id="btn-cred" onclick="setPay('credito')">CRÉDITO</div>
            <div class="method-btn" id="btn-deb" onclick="setPay('debito')">DÉBITO</div>
            <div class="method-btn" id="btn-pix" onclick="setPay('pix')">PIX</div>
        </div>
        <div id="pay-card">
            <input type="text" placeholder="NÚMERO DO CARTÃO">
            <div class="row">
                <input type="text" placeholder="MM/AA" style="flex: 1;">
                <input type="text" placeholder="CVV" style="flex: 1;">
            </div>
        </div>
        <div id="pay-pix-checkout" style="display:none; text-align: center;">
            <div style="background: #fff; width: 120px; height: 120px; margin: 0 auto 10px; padding: 10px; border-radius: 8px;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=TicketFutPagamento" alt="QR PIX Checkout">
            </div>
            <p style="font-size: 10px; color: var(--main-color);">CHAVE PIX: ingressos@ticketfut.com.br</p>
        </div>
        <button class="btn-action" onclick="confirmarCompra()">CONFIRMAR COMPRA</button>
    </div>
    <script src="../js/core/app.js"></script>
    <script src="../js/pagamento.js"></script>
</body>
</html>
