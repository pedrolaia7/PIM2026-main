<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | TicketFut</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <h2>NOVO <span>OPERADOR</span></h2>
        <input type="text" id="cad-nome" placeholder="NOME COMPLETO">
        <input type="text" id="cad-cpf" placeholder="CPF">
        <input type="email" id="cad-email" placeholder="E-MAIL">
        <input type="password" id="cad-senha" placeholder="SENHA">

        <select id="cad-time" onchange="updateTheme(this.value)">
            <option value="">FILIAÇÃO (TIME)</option>
            <option value="Palmeiras">Palmeiras</option>
            <option value="Corinthians">Corinthians</option>
            <option value="Flamengo">Flamengo</option>
            <option value="Sao Paulo">São Paulo</option>
        </select>

        <select id="cad-socio" onchange="toggleSocioPay(this.value)">
            <option value="0">SEM PLANO (SÓ INGRESSO)</option>
            <option value="0.05">SÓCIO BRONZE - 5% DESC.</option>
            <option value="0.10">SÓCIO PRATA - 10% DESC.</option>
            <option value="0.20">SÓCIO OURO - 20% DESC.</option>
        </select>

        <div id="area-pagamento-socio" style="display:none; margin-top: 15px; border-top: 1px solid #222; padding-top: 15px;">
            <p style="font-size: 11px; margin-bottom: 10px; color: var(--main-color);">PAGAMENTO DA ADESÃO:</p>
            <div class="pay-methods">
                <div class="method-btn active" id="s-btn-cred" onclick="setSocioPay('credito')">CRÉDITO</div>
                <div class="method-btn" id="s-btn-deb" onclick="setSocioPay('debito')">DÉBITO</div>
                <div class="method-btn" id="s-btn-pix" onclick="setSocioPay('pix')">PIX</div>
            </div>
            <div id="socio-card-fields">
                <input type="text" placeholder="NÚMERO DO CARTÃO">
                <div class="row">
                    <input type="text" placeholder="MM/AA" style="flex: 1;">
                    <input type="text" placeholder="CVV" style="flex: 1;">
                </div>
            </div>
            <div id="socio-pix-fields" style="display:none; text-align: center;">
                <div style="background: #fff; width: 100px; height: 100px; margin: 0 auto 10px; padding: 5px; border-radius: 4px;">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=90x90&data=SocioTicketFut" alt="QR PIX">
                </div>
                <p style="font-size: 10px; color: var(--main-color);">CHAVE PIX: socio@ticketfut.com.br</p>
            </div>
        </div>
        <button class="btn-action" onclick="finalizarCadastro()">FINALIZAR E ACESSAR</button>
    </div>
    <script src="../js/core/app.js"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
