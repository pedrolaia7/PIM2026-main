<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login | ArenaPRO</title>
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-effect"></div>
    <div class="cyber-panel p-10 w-full max-w-md">
        <h2 class="font-cyber text-3xl mb-8 text-center uppercase tracking-tighter">Acesso <span class="team-text">Tático</span></h2>
        
        <form id="formLogin" class="flex flex-col gap-4">
            <input type="email" id="email" placeholder="E-MAIL" class="p-3 bg-white/5 border border-white/10 text-white rounded outline-none focus:border-cyan-500" required>
            <input type="password" id="senha" placeholder="SENHA" class="p-3 bg-white/5 border border-white/10 text-white rounded outline-none focus:border-cyan-500" required>
            <button type="submit" class="btn-tactic mt-4">INICIAR SESSÃO</button>
        </form>
        
        <p class="text-center mt-6 text-xs text-gray-500">SEM ACESSO? <a href="cadastro.html" class="team-text">CRIAR CONTA</a></p>
    </div>

    <script src="../js/core/storage.js"></script>
    <script src="../js/core/utils.js"></script>

    <script>
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            // Busca os usuários no seu storage.js
            const users = Storage.getUsers();
            const user = users.find(u => u.email === email && u.senha === senha);

            if (user) {
                // Salva a sessão para o app.js (React) reconhecer
                Storage.setSession(user);
                
                // REDIRECIONAMENTO: Sai da pasta 'pages' e vai para o 'index.html' (Projeção)
                window.location.href = '../index.html'; 
            } else {
                alert("ACESSO NEGADO: E-mail ou senha incorretos.");
            }
        });
    </script>
</body>
</html>
