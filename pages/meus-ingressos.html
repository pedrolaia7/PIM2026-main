<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/global.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Minha Carteira | ArenaPRO</title>
</head>
<body class="p-8">
    <div class="bg-effect"></div>
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h2 class="font-cyber text-3xl uppercase tracking-tighter">Carteira de <span class="team-text">Ingressos</span></h2>
            <button onclick="window.location.href='index.html'" class="btn-tactic text-[10px]">VOLTAR</button>
        </div>
        
        <div id="ticketsList" class="grid gap-6">
            </div>
    </div>

<script src="../js/core/storage.js"></script>

<script src="../js/core/utils.js"></script>
    <script>
        const user = Storage.getSession();
        const tickets = Storage.getMyTickets(user.email);
        const list = document.getElementById('ticketsList');

        if(tickets.length === 0) {
            list.innerHTML = <div class="cyber-panel p-10 text-center text-gray-600 font-cyber">NENHUMA OPERAÇÃO ENCONTRADA.</div>;
        } else {
            tickets.forEach(t => {
                list.innerHTML += `
                    <div class="cyber-panel flex flex-col md:flex-row overflow-hidden border-l-4 border-var(--p) animate_animated animate_fadeInLeft">
                        <div class="p-8 flex-grow">
                            <p class="text-[10px] text-gray-500 font-cyber">REF: ${t.id}</p>
                            <h4 class="font-cyber text-2xl uppercase mt-2">${t.nome}</h4>
                            <p class="text-xs font-cyber team-text uppercase mt-1">Status: Confirmado em ${t.dataCompra}</p>
                        </div>
                        <div class="bg-white p-6 flex items-center justify-center md:w-40">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${t.id}" class="invert">
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
