<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArenaPRO | Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../CSS/global.css">
    
    <style>
        :root { --p: #00f2fe; }
        .font-cyber { font-family: 'Oxanium', sans-serif; }
        .sector { fill: rgba(255,255,255,0.05); stroke: var(--p); cursor: pointer; transition: 0.3s; }
        .sector:hover { fill: var(--p); opacity: 0.5; }
        .btn-tactic { 
            border: 1px solid var(--p); color: var(--p); padding: 10px; 
            width: 100%; font-family: 'Oxanium'; text-transform: uppercase;
        }
        .team-text { color: var(--p); text-shadow: 0 0 10px var(--p); }
        .cyber-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="bg-[#030712] text-white min-h-screen">
    
    <nav class="cyber-panel m-4 p-4 flex justify-between items-center">
        <h1 class="font-cyber text-xl team-text">ArenaPRO // <span id="userName">OPERADOR</span></h1>
        <div class="flex gap-4 font-cyber text-[10px] uppercase">
            <a href="meus-ingressos.html" class="hover:text-white text-gray-400">Meus Ingressos</a>
            <a href="socio.html" class="hover:text-white text-gray-400">Cartões</a>
            <button onclick="Storage.logout()" class="text-red-500 hover:font-bold">[SAIR]</button>
        </div>
    </nav>

    <main class="grid lg:grid-cols-2 gap-10 p-10 max-w-7xl mx-auto">
        <div class="cyber-panel p-8 rounded-xl">
            <h3 class="font-cyber mb-6 uppercase tracking-widest text-sm border-b border-white/10 pb-2">Projeção do Estádio</h3>
            <svg viewBox="0 0 400 300" class="w-full">
                <path d="M100,20 L300,20 L330,70 L70,70 Z" class="sector" onclick="selectSector('Superior Norte', 150)"/>
                <path d="M100,280 L300,280 L330,230 L70,230 Z" class="sector" onclick="selectSector('Inferior Sul', 100)"/>
                <path d="M340,80 L390,80 L390,220 L340,220 Z" class="sector" onclick="selectSector('VIP Leste', 350)"/>
                <path d="M10,80 L60,80 L60,220 L10,220 Z" class="sector" onclick="selectSector('Oeste Premium', 400)"/>
                <rect x="120" y="110" width="160" height="80" fill="none" stroke="var(--p)" stroke-dasharray="2" opacity="0.3"/>
            </svg>
            <p class="text-[9px] text-center mt-4 text-gray-600 uppercase tracking-widest">Clique em um setor para alocar</p>
        </div>

        <div class="cyber-panel p-8 rounded-xl" id="checkout">
            <h3 class="font-cyber mb-6 uppercase tracking-widest text-sm border-b border-white/10 pb-2">Resumo da Missão</h3>
            <div id="selectionInfo" class="flex flex-col items-center justify-center h-64 text-gray-500 font-cyber text-xs text-center">
                <div class="animate-pulse">
                    [ AGUARDANDO SELEÇÃO DE SETOR NO MAPA... ]
                </div>
            </div>
        </div>
    </main>

    <script src="../js/core/storage.js"></script>
    <script src="../js/core/utils.js"></script>
        <script src="login.html"></script>

    


    <script>
        const user = Storage.getSession();
        if(!user) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('userName').innerText = user.nome.toUpperCase();
        }

        function selectSector(nome, preco) {
            const finalPreco = user.isSocio ? preco / 2 : preco;
            
            Storage.setCart({ 
                jogo: "PRÓXIMA MISSÃO", 
                setor: nome, 
                preco: finalPreco 
            });

            const infoDiv = document.getElementById('selectionInfo');
            infoDiv.classList.remove('text-gray-500', 'justify-center');
            
            // CORREÇÃO: Uso de crases `` para o template string funcionar
            infoDiv.innerHTML = `
                <div class="animate__animated animate__fadeInLeft w-full space-y-6">
                    <div>
                        <p class="text-gray-400 text-[10px] uppercase">Setor Selecionado</p>
                        <p class="text-white text-2xl font-bold font-cyber">${nome}</p>
                    </div>
                    
                    <div>
                        <p class="text-gray-400 text-[10px] uppercase">Valor do Assento</p>
                        <p class="team-text text-4xl font-cyber font-bold">R$ ${finalPreco},00</p>
                        <p class="text-[9px] mt-1 ${user.isSocio ? 'text-green-500' : 'text-gray-500'}">
                            ${user.isSocio ? '✓ BENEFÍCIO SÓCIO APLICADO (-50%)' : '• TARIFA PADRÃO (SEM DESCONTO)'}
                        </p>
                    </div>

                    <div class="pt-6 border-t border-white/5">
                        <button onclick="window.location.href='pagamento.html'" class="btn-tactic hover:bg-cyan-500 hover:text-black transition duration-300">
                            PROSSEGUIR PARA PAGAMENTO
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
